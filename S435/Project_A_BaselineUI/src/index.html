<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Task List - Baseline</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>My Tasks</h1>
    <section class="task-list">
      <article class="task-card">
        <div class="task-left">
          <div class="icon">🔔</div>
        </div>
        <div class="task-main">
          <h2 class="task-title">Buy groceries</h2>
          <p class="task-meta">Jan 1 • Grocery list</p>
        </div>
        <div class="task-actions">
          <button class="btn btn-secondary">Edit</button>
          <button class="btn btn-primary">Done</button>
        </div>
      </article>
      <article class="task-card">
        <div class="task-left">
          <div class="icon">💻</div>
        </div>
        <div class="task-main">
          <h2 class="task-title">Finish project</h2>
          <p class="task-meta">Due Jan 3 • High priority</p>
        </div>
        <div class="task-actions">
          <button class="btn btn-secondary">Edit</button>
          <button class="btn btn-primary">Done</button>
        </div>
      </article>
      <article class="task-card">
        <div class="task-left">
          <div class="icon">📞</div>
        </div>
        <div class="task-main">
          <h2 class="task-title">Call Alice</h2>
          <p class="task-meta">Feb 5 • Remind about meeting</p>
        </div>
        <div class="task-actions">
          <button class="btn btn-secondary">Edit</button>
          <button class="btn btn-primary">Done</button>
        </div>
      </article>
      <article class="task-card">
        <div class="task-left">
          <div class="icon">🧹</div>
        </div>
        <div class="task-main">
          <h2 class="task-title">Clean office</h2>
          <p class="task-meta">Low priority</p>
        </div>
        <div class="task-actions">
          <button class="btn btn-secondary">Edit</button>
          <button class="btn btn-primary">Done</button>
        </div>
      </article>
      <article class="task-card">
        <div class="task-left">
          <div class="icon">📚</div>
        </div>
        <div class="task-main">
          <h2 class="task-title">Read book</h2>
          <p class="task-meta">Leisure</p>
        </div>
        <div class="task-actions">
          <button class="btn btn-secondary">Edit</button>
          <button class="btn btn-primary">Done</button>
        </div>
      </article>
    </section>
  </main>
  <script src="scripts.js"></script>
</body>
</html>
